[package]
name = "tls-qualification"
version = "0.0.0"
edition = "2021"
publish = false
description = "Real-engine qualification of verify-full TLS, rotation and endpoint admission (AST-2128)"

[dependencies]
rcgen = { version = "0.13", features = ["pem", "crypto", "aws_lc_rs"], default-features = false }
time = "0.3"

[dev-dependencies]
yb-tokio-postgres = { path = "../tokio-postgres", features = ["rustls-aws-lc-rs"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "io-util"] }
futures-util = "0.3"
# Server side of the loopback TLS fixtures (tests/admission.rs, tests/certificate_fields.rs).
tokio-rustls = { version = "0.26.2", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.10"

[features]
# Run the same suite with another provider: TLS_QUAL_PROVIDER=ring|fips.
ring = ["yb-tokio-postgres/rustls-ring"]
fips = ["yb-tokio-postgres/rustls-fips"]
